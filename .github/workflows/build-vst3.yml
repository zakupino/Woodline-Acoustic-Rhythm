name: Build Woodline VST3

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest build for a branch; avoid a queue of superseded commits.
concurrency:
  group: woodline-vst3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-vst3:
    name: Windows x64 VST3
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DJUCE_BUILD_EXTRAS=OFF -DJUCE_BUILD_EXAMPLES=OFF

      - name: Build Release VST3
        shell: pwsh
        run: cmake --build build --config Release --parallel 2

      - name: Upload Windows VST3
        uses: actions/upload-artifact@v7
        with:
          name: Woodline-Windows-x64-VST3
          path: build/Woodline_artefacts/Release/VST3/
          if-no-files-found: error
          retention-days: 30
